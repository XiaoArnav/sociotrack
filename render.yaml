services:
  - type: web
    name: sociotrack-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PYTHONPATH
        value: .:backend
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ENABLE_DEMO_MODE
        value: "false"
      # Secure secrets: Render automatically generates strong random keys on deploy
      - key: SECRET_KEY
        generateValue: true
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://frontend-taupe-zeta-84.vercel.app","https://sociotrack.vercel.app"]'
